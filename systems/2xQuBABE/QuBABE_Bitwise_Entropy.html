      // Calculates base quantum probabilities up to 4K + proportional bit scaling for T > 4K
      // Physical Boltzmann distribution without a temperature ceiling
const [driveMode, setDriveMode] = useState("thermal"); // "thermal" or "active"
const [inversion, setInversion] = useState("cooling");  // "cooling" or "pumping"

// Updated getProbabilities function supporting Quantum Double-Field / Laser Cooling
const getProbabilities = (temp, currentMode, drive, inv) => {
  if (drive === "active") {
    if (inv === "cooling") {
      // Laser Cooling: High ground state purity (>88% up to ~98%)
      const p0_active = Math.min(0.98, 0.88 + 0.10 * Math.exp(-temp / 10));
      if (currentMode === "qubit") {
        return [p0_active, 1 - p0_active, 0];
      } else {
        const rem = (1 - p0_active) / 2;
        return [p0_active, rem, rem]; // Excited states drop well below 33.3%
      }
    } else {
      // Active Pumping / Population Inversion into Excited States |2> (>88%)
      const p_ex = Math.min(0.98, 0.88 + 0.10 * Math.exp(-temp / 10));
      if (currentMode === "qubit") {
        return [1 - p_ex, p_ex, 0];
      } else {
        const rem = (1 - p_ex);
        return [rem * 0.5, rem * 0.5, p_ex]; // p0 + p1 = rem (~12%), p2 = p_ex (88%+); Dominantly excited |1> and |2>
      }
    }
  }

  // Fallback to Thermal Boltzmann Distribution
  const dE = 1.5;
  if (currentMode === "qubit") {
    const z = 1 + Math.exp(-dE / temp);
    return [1 / z, Math.exp(-dE / temp) / z, 0];
  } else {
    const z = 1 + Math.exp(-dE / temp) + Math.exp((-2 * dE) / temp);
    return [1 / z, Math.exp(-dE / temp) / z, Math.exp((-2 * dE) / temp) / z];
  }
};

      const computeBaseEntropy = (probs) => {
        return probs.reduce((acc, p) => {
          if (p <= 0) return acc;
          return acc - p * Math.log2(p);
        }, 0);
      };

      // Proportional 1-bit addition for every 4K step above 4K (approaching infinity towards 300K)
      const baseEntropy = computeBaseEntropy([p0, p1, p2]);
      const addedBits = temperature > 4.0 ? (temperature - 4.0) / 4.0 : 0;
      const entropy = baseEntropy + addedBits;

);

      return { min: 0.05, max: 2.17 };
    } else {
      // Active pumping regime: High field-driven regime (e.g., 2.17 K to 15.0 K)
      return { min: 2.17, max: 15.0 };
    }
  }
  // Full thermal bath range
  return { min: 0.05, max: 300.0 };
};
